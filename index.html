<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MalScan - Malaria Detection</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
}

/* Header */
header {
    text-align: center;
    padding: 30px;
}

header h1 {
    font-size: 3rem;
}

header p {
    opacity: 0.8;
}

/* Card */
.card {
    background: rgba(255,255,255,0.1);
    width: 420px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    backdrop-filter: blur(10px);
}

/* Drop */
#drop-area {
    border: 2px dashed white;
    padding: 40px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

#drop-area:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.03);
}

/* Preview */
#preview img {
    width: 200px;
    margin-top: 15px;
    border-radius: 10px;
}

/* Button */
button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

/* Result */
#result {
    margin-top: 20px;
    font-size: 1.5rem;
}

/* Sections */
.section {
    margin: 50px auto;
    width: 85%;
    max-width: 900px;
    text-align: center;
}

/* Cards container */
.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

/* Individual card */
.info-card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 12px;
    width: 250px;
    transition: 0.4s;
    cursor: pointer;
}

.info-card:hover {
    transform: translateY(-10px) scale(1.05);
    background: rgba(255,255,255,0.2);
}

/* Links */
a {
    color: #00c6ff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* Lab Button */
.map-btn {
    padding: 15px 30px;
    font-size: 18px;
    margin-top: 20px;
    border-radius: 10px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
}

.map-btn:hover {
    transform: scale(1.1);
}

/* Footer */
footer {
    text-align: center;
    margin: 30px;
    opacity: 0.7;
}
</style>
</head>

<body>

<header>
    <h1>🧪 MalScan</h1>
    <p>AI-Powered Malaria Detection</p>
</header>

<div class="card">

    <div id="drop-area">
        <p>📂 Drag & Drop Image</p>
        <p>or click to upload</p>
        <input type="file" id="fileElem" accept="image/*" hidden>
    </div>

    <div id="preview"></div>

    <button onclick="uploadFile()">🔍 Predict</button>

    <div id="result"></div>

</div>

<!-- Helplines -->
<div class="section">
    <h2>📞 Helplines</h2>
    <div class="cards">

        <div class="info-card">
            <h3>Health Helpline</h3>
            <p>📞 1075</p>
        </div>

        <div class="info-card">
            <h3>Emergency</h3>
            <p>🚑 112</p>
        </div>

        <div class="info-card">
            <h3>Official Sites</h3>
            <p>
                <a href="https://www.nhp.gov.in" target="_blank">Health Portal</a><br>
                <a href="https://www.mohfw.gov.in" target="_blank">MoHFW</a>
            </p>
        </div>

    </div>
</div>

<!-- Nearby Labs -->
<div class="section">
    <h2>📍 Test Centers</h2>
    <p>Find diagnostic labs near you instantly</p>

    <button class="map-btn" onclick="openMaps()">
        🔎 Find Nearby Labs
    </button>
</div>

<footer>
    <p></p>
</footer>

<script>
let file;

const dropArea = document.getElementById("drop-area");

dropArea.addEventListener("click", () => {
    document.getElementById("fileElem").click();
});

dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
});

dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    file = e.dataTransfer.files[0];
    showPreview(file);
});

document.getElementById("fileElem").addEventListener("change", function() {
    file = this.files[0];
    showPreview(file);
});

function showPreview(file) {
    document.getElementById("preview").innerHTML =
        `<img src="${URL.createObjectURL(file)}">`;
}

function uploadFile() {
    if (!file) {
        alert("Please select an image!");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    document.getElementById("result").innerText = "⏳ Processing...";

    fetch("/predict", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        let res = data.prediction;

        if (res === "Infected") {
            result.style.color = "red";
        } else {
            result.style.color = "lightgreen";
        }

        result.innerText = "Result: " + res;
    })
    .catch(() => {
        result.innerText = "Server error";
    });
}

function openMaps() {
    window.open("https://www.google.com/maps/search/diagnostic+labs+near+me");
}
</script>

</body>
</html>
